<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biblioteca Escolar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#1e293b;background:#f8fafc}*{box-sizing:border-box}body{margin:0}header{background:#3730a3;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}main{max-width:1100px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:150px}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:650;background:#e2e8f0}button.primary{background:#4338ca;color:white}button.danger{background:#be123c;color:white}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;margin:4px 0 10px}label{font-weight:650;font-size:14px}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0}th{background:#f1f5f9}.table{overflow:auto}.hidden{display:none!important}.note{color:#64748b;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.status{padding:10px;border-radius:8px;background:#eef2ff;margin:12px 0}h1{margin:0;font-size:24px}h2{margin-top:0}
</style></head>
<body>
<header><div><h1>📚 Biblioteca Escolar</h1><div>Catálogo y gestión de préstamos</div></div><div class="row" style="flex:0 1 auto"><span id="mode">Consulta pública</span><button id="loginBtn" class="primary" onclick="openLogin()">Ingresar como gestora</button><button id="logoutBtn" class="danger hidden" onclick="logout()">Salir</button></div></header>
<main>
<div id="message" class="status">Conectando con el catálogo…</div>
<section class="panel"><h2>Catálogo de libros</h2><div class="row"><div><label for="search">Buscar en el catálogo</label><input id="search" placeholder="Título, autor, ISBN, inventario o palabra clave" oninput="renderBooks()"></div><div><label for="areaFilter">Ordenar / filtrar por área</label><select id="areaFilter" onchange="renderBooks()"><option value="">Todas las áreas (orden alfabético)</option></select></div></div><div id="catalog"></div></section>
<section id="admin" class="hidden">
<div class="tabs"><button onclick="tab('books')">Libros</button><button onclick="tab('people')">Personas</button><button onclick="tab('loans')">Préstamos</button></div>
<section id="booksTab" class="panel"><h2>Registrar o editar libro</h2><form id="bookForm"><input type="hidden" id="bookId"><div class="row"><div><label>Título *</label><input id="title" required></div><div><label>Autor</label><input id="author"></div><div><label>Género</label><input id="genre"></div><div><label>Ejemplares</label><input id="quantity" type="number" min="0" value="1" required></div></div><div class="row"><div><label>Área / materia</label><input id="area" placeholder="Ej.: Ciencias Sociales"></div><div><label>Subárea / tema</label><input id="subarea"></div><div><label>Ciclo sugerido</label><input id="cycle"></div><div><label>Nivel educativo</label><select id="educational_level"><option value="">Seleccionar...</option><option>Inicial</option><option>Primario</option><option>Secundario</option><option>Superior</option><option>General</option></select></div></div>
<div class="row"><div><label>N.º de inventario</label><input id="inventory_number" placeholder="Ej.: INV-0001"></div><div><label>ISBN</label><input id="isbn" placeholder="ISBN-10 o ISBN-13"></div><div><label>Editorial</label><input id="publisher"></div><div><label>Edición</label><input id="edition"></div></div>
<div class="row"><div><label>Lugar de publicación</label><input id="publication_place"></div><div><label>Año de publicación</label><input id="publication_year" type="number" min="1000" max="2100"></div><div><label>N.º de páginas</label><input id="pages" type="number" min="0"></div><div><label>Tipo de material</label><select id="material_type"><option value="">Seleccionar...</option><option>Libro</option><option>Manual escolar</option><option>Diccionario</option><option>Enciclopedia</option><option>Revista</option><option>Atlas</option><option>Material didáctico</option><option>Otro</option></select></div></div>
<div class="row"><div><label>Código de clasificación</label><input id="classification_code"></div><div><label>Ubicación física</label><input id="shelf_location" placeholder="Ej.: Estante 2, armario A"></div><div><label>Palabras clave</label><input id="keywords"></div><div><label>Estado de conservación</label><select id="condition_status"><option value="">Sin especificar</option><option>Bueno</option><option>Regular</option><option>Malo</option></select></div></div>
<div class="row"><div><label>Procedencia</label><select id="acquisition_source"><option value="">Sin especificar</option><option>Compra</option><option>Donación</option><option>Transferencia</option><option>Otro</option></select></div><div><label>Fecha de ingreso</label><input id="acquisition_date" type="date"></div></div><label>Resumen</label><textarea id="summary" rows="2"></textarea><label>Contenidos / notas</label><input id="notes"><label>Actividad sugerida</label><input id="activity"><button class="primary">Guardar libro</button><button type="button" onclick="resetBook()">Limpiar</button></form><div class="table" id="bookTable"></div></section>
<section id="peopleTab" class="panel hidden"><h2>Alumnos y docentes</h2><form id="personForm"><input type="hidden" id="personId"><div class="row"><div><label>Nombre completo *</label><input id="personName" required></div><div><label>Tipo</label><select id="role"><option>Alumno</option><option>Docente</option><option>Otro</option></select></div><div><label>Curso / área</label><input id="group"></div></div><label>Observaciones</label><input id="personNotes"><button class="primary">Guardar persona</button></form><div class="table" id="peopleTable"></div></section>
<section id="loansTab" class="panel hidden"><h2>Registrar préstamo</h2><form id="loanForm"><div class="row"><div><label>Libro *</label><select id="loanBook" required></select></div><div><label>Solicitante *</label><input id="borrower" required></div><div><label>Fecha de préstamo</label><input id="loanDate" type="date" required></div><div><label>Devolución prevista</label><input id="dueDate" type="date" required></div></div><label>Observaciones</label><input id="loanNotes"><button class="primary">Registrar préstamo</button></form><h2>Préstamos e historial</h2><div class="table" id="loanTable"></div></section>
</section>
</main>
<div id="modal" class="hidden" style="position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px"><div class="panel" style="width:min(440px,100%)"><h2>Acceso de gestora</h2><form id="loginForm"><label>Correo electrónico</label><input id="email" type="email" autocomplete="username" required><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required><div class="row"><button type="button" onclick="closeLogin()">Cancelar</button><button class="primary">Ingresar</button></div></form><p class="note">Usá el correo y la contraseña que creaste en Supabase.</p></div></div>
<script>
'use strict';
const SUPABASE_URL='https://kztehzlhlyzmvjkcmehf.supabase.co';
const SUPABASE_KEY='sb_publishable_SzjeJxxwRSjAqax39tBvJw_IwmMp_gv';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let books=[],people=[],loans=[],isAdmin=false;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
function msg(s){$('message').textContent=s}
function active(id){return loans.filter(l=>l.book_id===id&&!l.returned_at).length}
function avail(b){return Math.max(0,Number(b.quantity||0)-active(b.id))}
async function load(){
 try{const r=await db.from('books').select('*').order('title');if(r.error)throw r.error;books=r.data||[];
 if(isAdmin){let p=await db.from('people').select('*').order('name');if(p.error)throw p.error;people=p.data||[];let l=await db.from('loans').select('*').order('loan_date',{ascending:false});if(l.error)throw l.error;loans=l.data||[];}
 renderBooks();if(isAdmin){renderBookTable();renderPeople();renderLoans();fillLoanBooks()}msg('Datos cargados desde Supabase.');}
 catch(e){msg('No se pudieron cargar los datos: '+(e.message||e));}
}
function renderBooks(){let q=$('search').value.toLocaleLowerCase('es');let area=$('areaFilter').value;let list=books.filter(b=>([b.title,b.subtitle,b.author,b.genre,b.summary,b.area,b.subarea,b.isbn,b.inventory_number,b.keywords,b.publisher,b.classification_code].join(' ')).toLocaleLowerCase('es').includes(q)&&(!area||b.area===area)).sort((a,b)=>(a.area||'Sin área').localeCompare(b.area||'Sin área','es')||(a.title||'').localeCompare(b.title||'','es'));let areas=[...new Set(books.map(b=>b.area).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));let sel=$('areaFilter');let old=sel.value;let options='<option value="">Todas las áreas (orden alfabético)</option>'+areas.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');if(sel.innerHTML!==options)sel.innerHTML=options;sel.value=areas.includes(old)?old:'';$('catalog').innerHTML=list.length?list.map(b=>`<article class="panel"><b>${esc(b.title)}</b>${b.subtitle?`<div>${esc(b.subtitle)}</div>`:''}<div>${esc(b.author)} · ${esc(b.genre)}</div><div class="note">Área: ${esc(b.area||'Sin área')}${b.subarea?' · Tema: '+esc(b.subarea):''}</div><div class="note">Inventario: ${esc(b.inventory_number||'—')} · ISBN: ${esc(b.isbn||'—')}</div><div class="note">${esc(b.publisher||'')}${b.publication_year?' · '+esc(b.publication_year):''}${b.pages?' · '+esc(b.pages)+' páginas':''}${b.shelf_location?' · Ubicación: '+esc(b.shelf_location):''}</div><p>${esc(b.summary||'')}</p><b>${isAdmin?avail(b)+' disponibles de '+b.quantity:b.quantity+' ejemplares registrados'}</b></article>`).join(''):'<p>No hay libros para mostrar.</p>'}
function renderBookTable(){let sorted=[...books].sort((a,b)=>(a.area||'Sin área').localeCompare(b.area||'Sin área','es')||(a.title||'').localeCompare(b.title||'','es'));$('bookTable').innerHTML=sorted.length?`<table><tr><th>Área</th><th>Inventario</th><th>Título</th><th>Autor</th><th>ISBN</th><th>Ejemplares</th><th>Acciones</th></tr>${sorted.map(b=>`<tr><td>${esc(b.area||'Sin área')}</td><td>${esc(b.inventory_number||'—')}</td><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${esc(b.isbn||'—')}</td><td>${b.quantity}</td><td><button onclick="editBook('${b.id}')">Editar</button> <button class="danger" onclick="deleteBook('${b.id}')">Eliminar</button></td></tr>`).join('')}</table>`:'<p>No hay libros registrados.</p>'}
function resetBook(){$('bookForm').reset();$('bookId').value='';$('quantity').value=1}
function editBook(id){let b=books.find(x=>x.id===id);if(!b)return;$('bookId').value=b.id;['title','author','genre','quantity','area','subarea','cycle','educational_level','inventory_number','isbn','publisher','edition','publication_place','publication_year','pages','material_type','classification_code','shelf_location','keywords','condition_status','acquisition_source','acquisition_date','summary','notes','activity'].forEach(k=>$(k).value=b[k]??'');window.scrollTo({top:0,behavior:'smooth'})}
$('bookForm').addEventListener('submit',async e=>{e.preventDefault();if(!isAdmin)return;let id=$('bookId').value;let obj={id:id||uid(),title:$('title').value.trim(),author:$('author').value.trim(),genre:$('genre').value.trim(),quantity:Number($('quantity').value),area:$('area').value.trim(),subarea:$('subarea').value.trim(),cycle:$('cycle').value.trim(),educational_level:$('educational_level').value,inventory_number:$('inventory_number').value.trim(),isbn:$('isbn').value.trim(),publisher:$('publisher').value.trim(),edition:$('edition').value.trim(),publication_place:$('publication_place').value.trim(),publication_year:$('publication_year').value?Number($('publication_year').value):null,pages:$('pages').value?Number($('pages').value):null,material_type:$('material_type').value,classification_code:$('classification_code').value.trim(),shelf_location:$('shelf_location').value.trim(),keywords:$('keywords').value.trim(),condition_status:$('condition_status').value,acquisition_source:$('acquisition_source').value,acquisition_date:$('acquisition_date').value||null,summary:$('summary').value.trim(),notes:$('notes').value.trim(),activity:$('activity').value.trim()};if(id&&obj.quantity<active(id)){alert('La cantidad no puede ser menor que los préstamos activos.');return}try{let r=await db.from('books').upsert(obj);if(r.error)throw r.error;resetBook();await load();msg('Libro guardado en Supabase.')}catch(x){alert('No se pudo guardar el libro: '+x.message)}})
async function deleteBook(id){if(active(id)){alert('Primero registrá la devolución de los préstamos activos.');return}if(confirm('¿Eliminar este libro?')){let r=await db.from('books').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}}
function renderPeople(){$('peopleTable').innerHTML=people.length?`<table><tr><th>Nombre</th><th>Tipo</th><th>Curso/área</th><th>Acciones</th></tr>${people.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.role)}</td><td>${esc(p.group)}</td><td><button onclick="editPerson('${p.id}')">Editar</button> <button class="danger" onclick="deletePerson('${p.id}')">Eliminar</button></td></tr>`).join('')}</table>`:'<p>No hay personas registradas.</p>'}
function editPerson(id){let p=people.find(x=>x.id===id);if(!p)return;$('personId').value=id;$('personName').value=p.name;$('role').value=p.role;$('group').value=p.group;$('personNotes').value=p.notes}
$('personForm').addEventListener('submit',async e=>{e.preventDefault();let id=$('personId').value;let obj={id:id||uid(),name:$('personName').value.trim(),role:$('role').value,group:$('group').value.trim(),notes:$('personNotes').value.trim()};let r=await db.from('people').upsert(obj);if(r.error)alert(r.error.message);else{$('personForm').reset();$('personId').value='';await load()}})
async function deletePerson(id){if(confirm('¿Eliminar esta persona?')){let r=await db.from('people').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}}
function fillLoanBooks(){$('loanBook').innerHTML=books.filter(b=>avail(b)>0).map(b=>`<option value="${b.id}">${esc(b.title)} (${avail(b)} disponibles)</option>`).join('')}
$('loanForm').addEventListener('submit',async e=>{e.preventDefault();let b=books.find(x=>x.id===$('loanBook').value);if(!b||avail(b)<1){alert('No hay ejemplares disponibles.');return}let obj={id:uid(),book_id:b.id,book_title:b.title,borrower:$('borrower').value.trim(),person_id:'',loan_date:$('loanDate').value,due_date:$('dueDate').value,notes:$('loanNotes').value.trim(),returned_at:'',return_notes:''};if(obj.due_date<obj.loan_date){alert('La fecha límite no puede ser anterior al préstamo.');return}let r=await db.from('loans').insert(obj);if(r.error)alert(r.error.message);else{$('loanForm').reset();setDates();await load()}})
function setDates(){$('loanDate').value=today();$('dueDate').value=new Date(Date.now()+14*86400000).toISOString().slice(0,10)}
function renderLoans(){$('loanTable').innerHTML=loans.length?`<table><tr><th>Libro</th><th>Solicitante</th><th>Préstamo</th><th>Vence</th><th>Estado / acción</th></tr>${loans.map(l=>`<tr><td>${esc(l.book_title)}</td><td>${esc(l.borrower)}</td><td>${esc(l.loan_date)}</td><td>${esc(l.due_date)}</td><td>${l.returned_at?'Devuelto '+esc(l.returned_at):`Activo <button class="primary" onclick="returnLoan('${l.id}')">Registrar devolución</button>`}</td></tr>`).join('')}</table>`:'<p>No hay préstamos registrados.</p>'}
async function returnLoan(id){if(!confirm('¿Confirmás la devolución?'))return;let r=await db.from('loans').update({returned_at:today()}).eq('id',id);if(r.error)alert(r.error.message);else load()}
function tab(name){['books','people','loans'].forEach(x=>$(x+'Tab').classList.toggle('hidden',x!==name))}
function openLogin(){$('modal').classList.remove('hidden')}
function closeLogin(){$('modal').classList.add('hidden')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){alert('No se pudo ingresar. Revisá el correo y la contraseña.');return}let user=r.data.user;let a=await db.from('library_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(a.error||!a.data){await db.auth.signOut();alert('Este usuario no está autorizado como gestora.');return}isAdmin=true;$('admin').classList.remove('hidden');$('loginBtn').classList.add('hidden');$('logoutBtn').classList.remove('hidden');$('mode').textContent='Modo gestora';closeLogin();await load();tab('books')})
async function logout(){await db.auth.signOut();isAdmin=false;people=[];loans=[];$('admin').classList.add('hidden');$('loginBtn').classList.remove('hidden');$('logoutBtn').classList.add('hidden');$('mode').textContent='Consulta pública';await load()}
(async()=>{setDates();const {data:{session}}=await db.auth.getSession();if(session){let a=await db.from('library_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(a.data){isAdmin=true;$('admin').classList.remove('hidden');$('loginBtn').classList.add('hidden');$('logoutBtn').classList.remove('hidden');$('mode').textContent='Modo gestora'}}await load()})();
</script></body></html>
