<script>
'use strict';
const SUPABASE_URL='https://kztehzlhlyzmvjkcmehf.supabase.co';
const SUPABASE_KEY='sb_publishable_SzjeJxxwRSjAqax39tBvJw_IwmMp_gv';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let books=[],people=[],loans=[],isAdmin=false;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function msg(s){$('message').textContent=s}
function active(id){return loans.filter(l=>l.book_id===id&&!l.returned_at).length}
function avail(b){return Math.max(0,Number(b.quantity||0)-active(b.id))}
async function load(){
 try{const r=await db.from('books').select('*').order('title');if(r.error)throw r.error;books=r.data||[];
 if(isAdmin){let p=await db.from('people').select('*').order('name');if(p.error)throw p.error;people=p.data||[];let l=await db.from('loans').select('*').order('loan_date',{ascending:false});if(l.error)throw l.error;loans=l.data||[];}
 renderBooks();if(isAdmin){renderBookTable();renderPeople();renderLoans();fillLoanBooks()}msg('Datos cargados desde Supabase.');}
 catch(e){msg('No se pudieron cargar los datos: '+(e.message||e));}
}
function renderBooks(){let q=$('search').value.toLocaleLowerCase('es');let list=books.filter(b=>(b.title+' '+b.author+' '+b.genre+' '+b.summary+' '+b.area).toLocaleLowerCase('es').includes(q));$('catalog').innerHTML=list.length?list.map(b=>`<article class="panel"><b>${esc(b.title)}</b><div>${esc(b.author)} Â· ${esc(b.genre)}</div><p>${esc(b.summary||'')}</p><div class="note">${esc(b.area||'')} Â· ${esc(b.cycle||'')} Â· ${esc(b.publisher||'')}</div><b>${isAdmin?avail(b)+' disponibles de '+b.quantity:b.quantity+' ejemplares registrados'}</b></article>`).join(''):'<p>No hay libros para mostrar.</p>'}
function renderBookTable(){$('bookTable').innerHTML=books.length?`<table><tr><th>TÃ­tulo</th><th>Autor</th><th>Ejemplares</th><th>Acciones</th></tr>${books.map(b=>`<tr><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${b.quantity}</td><td><button onclick="editBook('${b.id}')">Editar</button> <button class="danger" onclick="deleteBook('${b.id}')">Eliminar</button></td></tr>`).join('')}</table>`:'<p>No hay libros registrados.</p>'}
function resetBook(){$('bookForm').reset();$('bookId').value='';$('quantity').value=1}
function editBook(id){let b=books.find(x=>x.id===id);if(!b)return;$('bookId').value=b.id;['title','author','genre','quantity','area','cycle','publisher','summary','notes','activity'].forEach(k=>$(k).value=b[k]??'');window.scrollTo({top:0,behavior:'smooth'})}
$('bookForm').addEventListener('submit',async e=>{e.preventDefault();if(!isAdmin)return;let id=$('bookId').value;let obj={id:id||uid(),title:$('title').value.trim(),author:$('author').value.trim(),genre:$('genre').value.trim(),quantity:Number($('quantity').value),area:$('area').value.trim(),cycle:$('cycle').value.trim(),publisher:$('publisher').value.trim(),summary:$('summary').value.trim(),notes:$('notes').value.trim(),activity:$('activity').value.trim()};if(id&&obj.quantity<active(id)){alert('La cantidad no puede ser menor que los prÃ©stamos activos.');return}try{let r=await db.from('books').upsert(obj);if(r.error)throw r.error;resetBook();await load();msg('Libro guardado en Supabase.')}catch(x){alert('No se pudo guardar el libro: '+x.message)}})
async function deleteBook(id){if(active(id)){alert('Primero registrÃ¡ la devoluciÃ³n de los prÃ©stamos activos.');return}if(confirm('Â¿Eliminar este libro?')){let r=await db.from('books').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}}
function renderPeople(){$('peopleTable').innerHTML=people.length?`<table><tr><th>Nombre</th><th>Tipo</th><th>Curso/Ã¡rea</th><th>Acciones</th></tr>${people.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.role)}</td><td>${esc(p.group)}</td><td><button onclick="editPerson('${p.id}')">Editar</button> <button class="danger" onclick="deletePerson('${p.id}')">Eliminar</button></td></tr>`).join('')}</table>`:'<p>No hay personas registradas.</p>'}
function editPerson(id){let p=people.find(x=>x.id===id);if(!p)return;$('personId').value=id;$('personName').value=p.name;$('role').value=p.role;$('group').value=p.group;$('personNotes').value=p.notes}
$('personForm').addEventListener('submit',async e=>{e.preventDefault();let id=$('personId').value;let obj={id:id||uid(),name:$('personName').value.trim(),role:$('role').value,group:$('group').value.trim(),notes:$('personNotes').value.trim()};let r=await db.from('people').upsert(obj);if(r.error)alert(r.error.message);else{$('personForm').reset();$('personId').value='';await load()}})
async function deletePerson(id){if(confirm('Â¿Eliminar esta persona?')){let r=await db.from('people').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}}
function fillLoanBooks(){$('loanBook').innerHTML=books.filter(b=>avail(b)>0).map(b=>`<option value="${b.id}">${esc(b.title)} (${avail(b)} disponibles)</option>`).join('')}
$('loanForm').addEventListener('submit',async e=>{e.preventDefault();let b=books.find(x=>x.id===$('loanBook').value);if(!b||avail(b)<1){alert('No hay ejemplares disponibles.');return}let obj={id:uid(),book_id:b.id,book_title:b.title,borrower:$('borrower').value.trim(),person_id:'',loan_date:$('loanDate').value,due_date:$('dueDate').value,notes:$('loanNotes').value.trim(),returned_at:'',return_notes:''};if(obj.due_date<obj.loan_date){alert('La fecha lÃ­mite no puede ser anterior al prÃ©stamo.');return}let r=await db.from('loans').insert(obj);if(r.error)alert(r.error.message);else{$('loanForm').reset();setDates();await load()}})
function setDates(){$('loanDate').value=today();$('dueDate').value=new Date(Date.now()+14*86400000).toISOString().slice(0,10)}

async function returnLoan(id){if(!confirm('Â¿ConfirmÃ¡s la devoluciÃ³n?'))return;let r=await db.from('loans').update({returned_at:today()}).eq('id',id);if(r.error)alert(r.error.message);else load()}
function tab(name){['books','people','loans'].forEach(x=>$(x+'Tab').classList.toggle('hidden',x!==name))}
function openLogin(){$('modal').classList.remove('hidden')}
function closeLogin(){$('modal').classList.add('hidden')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){alert('No se pudo ingresar. RevisÃ¡ el correo y la contraseÃ±a.');return}let user=r.data.user;let a=await db.from('library_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(a.error||!a.data){await db.auth.signOut();alert('Este usuario no estÃ¡ autorizado como gestora.');return}isAdmin=true;$('admin').classList.remove('hidden');$('loginBtn').classList.add('hidden');$('logoutBtn').classList.remove('hidden');$('mode').textContent='Modo gestora';closeLogin();await load();tab('books')})
async function logout(){await db.auth.signOut();isAdmin=false;people=[];loans=[];$('admin').classList.add('hidden');$('loginBtn').classList.remove('hidden');$('logoutBtn').classList.add('hidden');$('mode').textContent='Consulta pÃºblica';await load()}
(async()=>{setDates();const {data:{session}}=await db.auth.getSession();if(session){let a=await db.from('library_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(a.data){isAdmin=true;$('admin').classList.remove('hidden');$('loginBtn').classList.add('hidden');$('logoutBtn').classList.remove('hidden');$('mode').textContent='Modo gestora'}}await load()})();
</script></body></html>
